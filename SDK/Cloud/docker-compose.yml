services:
  emqx:
    image: emqx/emqx-enterprise:6.1.0
    container_name: emqx-enterprise
    hostname: node1.emqx.com
    restart: always

    environment:
      - EMQX_NODE_NAME=emqx@node1.emqx.com

    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"

    volumes:
      - ./data:/opt/emqx/data
      - ./log:/opt/emqx/log

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18083/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  sandgrain-cloud-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandgrain-cloud-app
    restart: always

    depends_on:
      emqx:
        condition: service_healthy

    env_file:
      - ./application_PoC_MQTT/.env

    volumes:
      - ./application_PoC_MQTT/device_credentials.json:/app/application_PoC_MQTT/device_credentials.json

    command: python -m app.main