# --- Console (BIST / TID / FSM logs print on the UART/COM port) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y

# The SDK sources use printf()/snprintf() heavily — route to the console.
CONFIG_PRINTK=y
CONFIG_PICOLIBC=y

# --- Interactive serial menu (y: menu on the COM port; n: auto-auth loop) ---
CONFIG_SANDGRAIN_INTERACTIVE_MENU=y
# Console input subsystem used by the menu (console_getchar). Harmless if the
# menu is disabled. CONSOLE_GETCHAR is a choice member, hence set here not via Kconfig.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# --- SPI to the SGT1001 crypto chip ---
CONFIG_SPI=y

# --- Bluetooth LE peripheral + Nordic UART Service (the device<->gateway link) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SandGrain-Dev"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y

# The SDK JSON frames (auth request / CW / RW / result) are up to ~130 bytes —
# raise the ATT MTU and ACL buffers so each frame fits in one NUS packet.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# The auth FSM keeps 512-byte TX/RX frame buffers on the main stack.
CONFIG_MAIN_STACK_SIZE=4096
