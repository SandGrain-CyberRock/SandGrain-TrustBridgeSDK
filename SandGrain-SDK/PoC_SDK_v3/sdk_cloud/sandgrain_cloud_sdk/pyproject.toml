[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandgrain-cloud-sdk"
version = "0.3.0"
description = "Cloud SDK (Python) for CyberRock authentication workflow (SandGrain adaptation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Company", email = "dev@yourcompany.com" }]
dependencies = [
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
protobuf = [
  "protobuf>=5.0.0",
]
mqtt = [
  "paho-mqtt>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
