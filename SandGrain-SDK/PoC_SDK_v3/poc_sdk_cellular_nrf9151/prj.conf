# SandGrain device+gateway combined build on the nRF9151 (cellular).
# LTE + MQTT config mirrors the proven cellular_mqtt_test; SPI + console menu
# mirror the proven poc_sdk_device_nrf builds.

# General
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging (the MQTT lib and modem lib report errors through it)
CONFIG_LOG=y

# Console + interactive menu (menu reads keystrokes -> no AT host on the UART)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PICOLIBC=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# SPI to the SGT1001 crypto chip
CONFIG_SPI=y
CONFIG_GPIO=y

# Modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_NET_IF=y

# Network: offloaded BSD/POSIX sockets over the LTE modem
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4600

# Duplicate Address Detection is not implemented for offloaded interfaces
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# TF-M (the /ns build target needs it; minimal profile)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# MQTT to the hosted TrustBridge broker (plain TCP, port 1883). Raw Zephyr
# MQTT client (app_mqtt.c owns the connection plumbing) instead of the NCS
# mqtt_helper wrapper: the presence Last Will - retained "offline" on
# sandgrain/v1/<tid>/status - and the client ID are built at RUNTIME from the
# chip's TID, so the same hex works on any board/chip, and the connection
# reconnects with backoff after an LTE/TCP drop.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y

# Faster dead-client detection: broker declares the client gone at 1.5x the
# keepalive -> ~45 s instead of the default 90 s. Pings are tiny; fine on LTE.
CONFIG_MQTT_KEEPALIVE=30
