name: TrustBridge

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENDPOINT: ${{ secrets.VITE_APP_ENDPOINT }}

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/*'
          target: '/tmp/trustbridge-deploy'
          strip_components: 1
          overwrite: true

      - name: Move files and restart nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/trustbridge
            sudo rm -rf /var/www/trustbridge/*
            sudo cp -r /tmp/trustbridge-deploy/* /var/www/trustbridge/
            sudo chown -R nginx:nginx /var/www/trustbridge
            sudo chmod -R 755 /var/www/trustbridge
            rm -rf /tmp/trustbridge-deploy
            sudo systemctl restart nginx
